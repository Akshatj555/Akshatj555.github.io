<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#120824" />
      <stop offset="100%" stop-color="#090314" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="2" />

  <!-- Code bracket < on the left -->
  <path d="M 17 24 L 10 32 L 17 40" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Stylized Geometric 'A' in the center -->
  <g filter="url(#glow)">
    <!-- Left leg of A -->
    <line x1="32" y1="16" x2="22" y2="48" stroke="url(#purpleGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Right leg of A -->
    <line x1="32" y1="16" x2="42" y2="48" stroke="url(#purpleGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Crossbar of A -->
    <line x1="26" y1="36" x2="38" y2="36" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Apex glow dot -->
    <circle cx="32" cy="16" r="2.5" fill="#f5d0fe" />
  </g>

  <!-- Code bracket > on the right -->
  <path d="M 47 24 L 54 32 L 47 40" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
